# This is the MLflow tracking server for pipeline observability.
#
# This server is self-hosted and uses sqlite with --serve-artifacts. This removes a
# dependency instead of adding one: the tracking server acts as its own artifact
# store proxy, so training pods need only mlflow-skinny, an HTTP client, and no
# object-store SDK or credentials. If you already run a tracking server, point
# MLFLOW_TRACKING_URI at it and remove this file. Rank-0 of the RayJob logs
# parameters and per-step loss here (see
# train/train_qwen3_deepspeed.py::_init_mlflow).
#
# This Deployment sets replicas=1, strategy Recreate, and `--workers=1` because
# sqlite allows only one writer. One server process avoids NFS lock conflicts that
# could corrupt the database under concurrent workers.
#
# This pod sets no runAsUser or fsGroup. OCP assigns them from the ml-training UID
# range instead, and the injected fsGroup owns /mlflow so that UID can write the
# database and artifacts. Every restricted-v2 security requirement (drop all
# capabilities, no privilege escalation, RuntimeDefault seccomp, runAsNonRoot) is set
# explicitly, so admission does not reject the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-store
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ckpt-training-pipeline
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: px-fb-direct-access-nfsv4-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ckpt-training-pipeline
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: ckpt-training-pipeline
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.22.0
          command: ["mlflow"]
          args:
            - "server"
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=sqlite:////mlflow/mlflow.db"
            - "--serve-artifacts"
            - "--artifacts-destination=file:///mlflow/artifacts"
            - "--workers=1"
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: store
              mountPath: /mlflow
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: mlflow-store
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ckpt-training-pipeline
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# This edge-terminated Route makes the UI reachable from a browser. In-cluster
# training pods use the Service DNS instead
# (http://mlflow.ml-training.svc.cluster.local:5000), through MLFLOW_TRACKING_URI,
# not this Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ckpt-training-pipeline
spec:
  to:
    kind: Service
    name: mlflow
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
