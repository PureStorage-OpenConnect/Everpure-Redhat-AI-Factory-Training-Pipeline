# OPTIONAL, UNWIRED SCAFFOLDING. This Secret is not referenced by base/10-storage/kustomization.yaml
# (see the WARNING in that file) and is not applied by any documented install path. It is an
# example for a customer who later wants Stork cloudsnap backups to an S3 target — add it to your
# own overlay, with real credentials, when you have one.
---
apiVersion: v1
kind: Secret
metadata:
  name: px-cloud-credentials
  namespace: portworx
  annotations:
    ml-training.example.com/status: repo-scaffold-only
type: Opaque
stringData:
  # Replace these placeholders with the real backup endpoint and credentials
  # before applying. The repo intentionally keeps this inert until a concrete
  # MinIO/S3 or FlashBlade target is approved.
  #
  # These four key names are what Stork's BackupLocation actually reads for a `type: s3`
  # secretConfig (verified against libopenstorage/stork's getMergedS3Config,
  # pkg/apis/stork/v1alpha1/backuplocation.go) — accessKeyID, secretAccessKey, endpoint, region.
  # Do not use s3-access-key/s3-secret-key/s3-endpoint/s3-region here, even though they look
  # plausible — Stork does not read those key names at all, and a BackupLocation built against
  # them silently gets empty credentials with no error.
  accessKeyID: "REPLACE_ME"
  secretAccessKey: "REPLACE_ME"
  endpoint: "https://REPLACE_ME:9000"
  region: "us-east-1"
