apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 20 — Argo Events. The `argo-events` namespace is fixed by the product, so it is
# written explicitly here rather than set by an overlay.
#
# NOTE: the Sensor trigger template embeds the APPLICATION namespace (the RayJob it creates)
# and the LocalQueue name. Kustomize namespace transformers do NOT rewrite values inside a
# trigger template body — see the OVERLAY CONTRACT note in overlays/*/30-pipeline.
resources:
  - eventbus.yaml
  - s3-eventsource-sensor.yaml
