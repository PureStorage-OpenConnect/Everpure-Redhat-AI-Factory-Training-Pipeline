# This is a RayJob. The Sensor (base/20-events/s3-eventsource-sensor.yaml) creates it when the S3
# poll loop finds a new dataset object. It replaces the V1 placeholder Job. It runs GPU training
# and removes its own RayCluster when the job ends.
#
# The RayJob controls three settings:
#   - shutdownAfterJobFinishes: true - delete the RayCluster (head + 4 L40S workers) when the job
#     reaches a terminal state. No human step is needed to free the GPUs.
#   - ttlSecondsAfterFinished - the wait time before that deletion, counted from the job end time.
#     GPUs stay held for this long after the job succeeds.
#   - activeDeadlineSeconds - a hard time limit so a hung run cannot hold GPUs forever.
#
# Fact: ttlSecondsAfterFinished deletes the RayCluster, not the RayJob object. The RayJob object
# can stay in the cluster long after its ttl passes. Read logs from the submitter pod; it stays
# after the RayCluster is gone.
#
# Do not choose a long ttl to have time to read logs. A long ttl holds every GPU in the job for
# that long after it finishes. Keep the ttl short and read logs from the submitter pod instead.
#
# Kueue quota clears at job SUCCEEDED. GPUs stay held until ttlSecondsAfterFinished ends.
# Do not treat cleared Kueue quota as free GPU capacity. Check that the RayCluster object has
# disappeared (`oc get raycluster -n ml-training`) before you count the GPUs as free.
#
# Code delivery: the submitter pod mounts the `train-code` ConfigMap
# (../30-pipeline/train-code-configmap.yaml). `ray job submit --working-dir` uploads the code, so
# no image rebuild and no `oc cp` step are needed. Use a module-form entrypoint
# (import ... m.main()). A plain `python train_...py` fails on the workers, because Ray
# serializes the entrypoint by module, not by script path.
#
# You can apply this object directly (name: qwen3-fbda-auto) for a manual run.
#
# Warning: a manual run of this object does not test the Sensor path. This object differs from the
# Sensor's RayJob on purpose:
#   - RUN_ID and CKPT_DIR are fixed values here. The Sensor sets RUN_ID per run from the
#     `ray.io/cluster` pod label.
#   - This object uses 4 worker replicas. The Sensor uses 8.
# A passing manual run does not prove the Sensor path works. To test the Sensor, put an object in
# the validation bucket and let the poller trigger it.
#
# The fixed RUN_ID means a repeat manual run overwrites the checkpoint at checkpoints/fbda-auto.
#
# Apply:  oc -n ml-training apply -f ../30-pipeline/train-code-configmap.yaml -f rayjob-train-ephemeral.yaml
# Watch:  oc -n ml-training get rayjob qwen3-fbda-auto -w      # jobStatus SUCCEEDED, then object removed
#         oc -n ml-training get raycluster                     # child cluster disappears (GPUs freed)
#
# Warning: always include `-n ml-training` in the commands above. These manifests do not set
# metadata.namespace on purpose; the Kustomize overlay sets it. A plain `oc apply -f` without `-n`
# applies to your current namespace instead. Kueue then finds no LocalQueue and suspends the job,
# with no error message. Use `make apply-phase OVERLAY=overlays/<yours> PHASE=<phase>` instead; it
# always uses the correct namespace.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: qwen3-fbda-auto
  labels:
    kueue.x-k8s.io/queue-name: ml-training-lq
    app.kubernetes.io/part-of: ckpt-training-pipeline
spec:
  entrypoint: python -c "import train_qwen3_deepspeed as m; m.main()"
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  # Use 14400 seconds (4 hours). This matches the Sensor's deadline, even though this file runs
  # only 4 workers where the Sensor runs 8 — see the per-step notes below for why the smaller
  # worker count does not shrink every step proportionally.
  #
  # The deadline starts at submission. It must cover four steps:
  #   - about 13 minutes to set up the pip packages on the head and 4 workers (this file's
  #     worker count; pip install time is per-pod, not aggregate, so fewer workers does not
  #     make this step faster)
  #   - about 125 minutes to run 60 training steps
  #   - the checkpoint write (about 366 GiB / ~393 GB total, written in parallel by the 4 workers
  #     here — roughly 92 GiB (~98 GB) per worker, about twice the per-worker share an 8-worker run
  #     writes for the same total)
  #   - the checkpoint upload to S3 (about 366 GiB / ~393 GB, sent serially from rank 0 regardless of
  #     worker count, since rank 0 alone walks and uploads the whole checkpoint directory)
  #
  # A deadline set too low can kill a run in the middle of the checkpoint write. This is the
  # most costly failure: it wastes 4-GPU time (this file's worker count) and leaves a broken
  # checkpoint.
  #
  # Do not lower this value to limit GPU use. It is a hard stop for a hung run, not a schedule.
  activeDeadlineSeconds: 14400
  # These package versions are pinned on purpose. An unpinned package installs whatever PyPI has
  # at start-up. This puts the pipeline's proof of exact-repeat training results at risk: a small
  # library update could change the training loss.
  #
  # These are the exact versions read from a known-good install log. Do
  # not change them without testing the run again for exact-repeat results.
  #
  # torch has no pinned version by default, and this is the biggest risk. Without a pin, pip
  # replaces the base image's torch 2.7.1 with torch 2.13.0 from PyPI. This also pulls in a new
  # CUDA 13 package set (96 extra packages per pod), which is most of the pipeline's start-up time.
  # The pin fixes torch, triton, and the CUDA package set together.
  #
  # torchvision has the same risk: the base image ships version 0.22.1, but pip upgrades it to
  # 0.28.0 without a pin. Version 0.28.0 is pinned here to match.
  #
  # This package list must match in 4 files: this file, the Sensor's embedded RayJob template, and
  # the other 2 opt-in manifests in this directory. Nothing in this published tree checks that
  # automatically — it is a manual invariant. If you change one file, change all 4 in the same
  # commit.
  runtimeEnvYAML: |
    working_dir: /home/ray/train_job
    pip:
      - deepspeed==0.19.5
      - transformers==5.15.0
      - accelerate==1.14.0
      - torch==2.13.0
      - torchvision==0.28.0
      - nvidia-nccl-cu12==2.29.7
      - mlflow-skinny==3.15.1
    pip_check: false
    env_vars:
      LD_LIBRARY_PATH: /usr/lib64
      # Ray 2.52 switched its metrics backend to OpenTelemetry by default. When RAY_USE_TLS is set
      # (this cluster's KubeRay operator injects it via a create-cert init container on every Ray
      # pod), the OTEL exporter does not pick up the TLS credentials needed to reach the dashboard
      # agent's now-TLS gRPC server, so metric export fails — matches
      # https://github.com/ray-project/ray/issues/59968 exactly, including the affected version
      # range (2.52+) this file pins. A GPU worker pod's own
      # /metrics endpoint shows zero ray_* series of any kind — not just the custom
      # ray_training_* ones — while its dashboard-agent log fills with "SSL_ERROR_SSL: ...
      # WRONG_VERSION_NUMBER: Invalid certificate verification context". Setting this reverts to
      # the legacy (pre-OTEL) metrics backend, which has no such TLS dependency; the same pod's
      # endpoint then correctly shows ray_training_global_step,
      # ray_training_total_steps and ray_training_steps_completed_total.
      RAY_enable_open_telemetry: "false"
      # Ray's default worker start-up timeout is 30 seconds. This is not enough time here, because
      # each pod must first install the pip packages above, which takes minutes. Without this
      # setting, Ray Train fails with:
      #   ray.train.ControllerError: The worker group startup timed out after 30.0 seconds
      #   waiting for N workers
      # Set this value to 600 seconds.
      RAY_TRAIN_WORKER_GROUP_START_TIMEOUT_S: "600"
      RUN_ID: fbda-auto
      CKPT_DIR: /mnt/fbda/ckpt-fbda-auto
      MAX_STEPS: "60"
      # Set this value to 4. It must match `replicas: 4` on the worker group below.
      #
      # Set this value explicitly. Do not leave it unset, even though the training code defaults
      # to 4. If you raise `replicas` without also raising this value, the world size stays wrong
      # and no error appears. World size must match the checkpoint's shard count; an 8-way sharded
      # checkpoint cannot be loaded at world size 4, or resharded.
      #
      # This value (4) differs from the Sensor's value (8) on purpose; see the file header. These
      # four values must agree with each other in this file: minReplicas, maxReplicas, replicas,
      # and NUM_WORKERS. Nothing in this published tree checks that automatically — treat it as a
      # manual invariant to maintain whenever you edit any one of the four.
      NUM_WORKERS: "4"
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: registry.redhat.io/rhoai/odh-pipeline-runtime-pytorch-cuda-py312-rhel9@sha256:f35ce6caacf4e34d8301f1867c67227cbafdcf76abd6588b09df7960a55ea869
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: train-code
              mountPath: /home/ray/train_job
      volumes:
        - name: train-code
          configMap:
            name: train-code
  rayClusterSpec:
    rayVersion: "2.52.1"
    headGroupSpec:
      rayStartParams:
        dashboard-host: "0.0.0.0"
        num-cpus: "0"
      template:
        spec:
          securityContext:
            # This job mounts a large existing volume. OnRootMismatch skips the recursive chown
            # when the root already matches the target IDs. This keeps mount time fast, instead
            # of slow with many files. See base/20-events/s3-eventsource-sensor.yaml for detail.
            fsGroupChangePolicy: OnRootMismatch
          nodeSelector:
            nvidia.com/gpu.present: "true"
          containers:
          - name: ray-head
            image: registry.redhat.io/rhoai/odh-pipeline-runtime-pytorch-cuda-py312-rhel9@sha256:f35ce6caacf4e34d8301f1867c67227cbafdcf76abd6588b09df7960a55ea869
            resources:
              requests:
                cpu: "2"
                memory: 24Gi
              limits:
                cpu: "2"
                memory: 24Gi
            ports:
            - containerPort: 6379
              name: gcs-server
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            volumeMounts:
            - name: fbda-shared
              mountPath: /mnt/fbda
          volumes:
          - name: fbda-shared
            persistentVolumeClaim:
              claimName: fbda-shared
    workerGroupSpecs:
    - groupName: gpu-worker
      minReplicas: 4
      maxReplicas: 4
      replicas: 4
      rayStartParams:
        num-gpus: "1"
      template:
        spec:
          securityContext:
            # This job mounts a large existing volume. OnRootMismatch skips the recursive chown
            # when the root already matches the target IDs. This keeps mount time fast, instead
            # of slow with many files. See base/20-events/s3-eventsource-sensor.yaml for detail.
            fsGroupChangePolicy: OnRootMismatch
          nodeSelector:
            nvidia.com/gpu.present: "true"
          containers:
          - name: ray-worker
            image: registry.redhat.io/rhoai/odh-pipeline-runtime-pytorch-cuda-py312-rhel9@sha256:f35ce6caacf4e34d8301f1867c67227cbafdcf76abd6588b09df7960a55ea869
            resources:
              requests:
                cpu: "6"
                memory: 180Gi
                # Qwen3-32B in safetensors is about 65 GB, downloaded to LOCAL_MODEL_DIR
                # (/tmp/qwen3-32b, train_qwen3_deepspeed.py) on every worker's container
                # writable layer, not a mounted volume. 90Gi/100Gi covers that plus headroom.
                ephemeral-storage: 90Gi
                nvidia.com/gpu: "1"
              limits:
                cpu: "6"
                memory: 400Gi
                ephemeral-storage: 100Gi
                nvidia.com/gpu: "1"
            envFrom:
            - configMapRef:
                name: pipeline-config
            env:
            - name: S3_ENDPOINT
              valueFrom: {secretKeyRef: {name: flashblade-s3, key: S3_ENDPOINT}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: flashblade-s3, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: flashblade-s3, key: AWS_SECRET_ACCESS_KEY}}
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.ml-training.svc.cluster.local:5000"
            - name: MLFLOW_EXPERIMENT
              value: "qwen3-fbda"
            # NCCL WATCHDOG. Turns a wedged training step into a clear failure instead of a
            # silent hang: if one rank dies or a network link stalls, the other ranks wait
            # forever inside a collective op, every pod stays Running/Ready, and
            # DCGM_FI_DEV_GPU_UTIL reads 100% for a rank stuck waiting — every signal says the
            # run is healthy. These settings make the monitoring thread stop the process once
            # the watchdog sees no progress and save a trace of the collective operation that
            # was running and which ranks never arrived. See the Sensor's embedded RayJob
            # template (base/20-events/s3-eventsource-sensor.yaml, search TORCH_NCCL) for the
            # full explanation, including why 1200 seconds and why these stay in `env:` and not
            # runtimeEnvYAML.
            - name: TORCH_NCCL_ENABLE_MONITORING
              value: "1"
            - name: TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC
              value: "1200"
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: "1"
            - name: TORCH_NCCL_TRACE_BUFFER_SIZE
              value: "2000"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "3"
            volumeMounts:
            - name: fbda-shared
              mountPath: /mnt/fbda
            # NCCL's shared-memory transport needs real /dev/shm, not the container
            # runtime's 64Mi default. 4Gi is not a tight floor here: a run of this
            # pipeline at this size shows under 1% utilization (33M used of 4Gi) during
            # real training — evidence of headroom, not a tight floor. Re-check this number
            # if NCCL SHM usage ever looks tight. This must match the Sensor's embedded
            # copy and the other RayJob/RayCluster manifests — there is no automated check
            # for this; it must be kept in sync by hand across all five manifests
            # (rayjob-eval-v8.yaml, rayjob-train-ephemeral.yaml, rayjob-resume-v5.yaml,
            # raycluster-fbda-checkpoint.yaml, and the Sensor's embedded copy in
            # s3-eventsource-sensor.yaml).
            - name: dev-shm
              mountPath: /dev/shm
          volumes:
          - name: fbda-shared
            persistentVolumeClaim:
              claimName: fbda-shared
          - name: dev-shm
            emptyDir:
              medium: Memory
              sizeLimit: 4Gi
