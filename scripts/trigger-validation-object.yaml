# Write one object into the validation bucket, from inside the cluster.
#
# WHAT THIS FILE DOES. Firing the pipeline means writing an object under the validation
# prefix. This must run in-cluster: the data VIP is not reachable from a workstation or from
# the bastion host, and the S3 credential lives in a Secret. No other place can both reach the
# endpoint and authenticate. Do not improvise this by hand with GPUs waiting — an unrepeatable,
# ad hoc write is how a two-hour run gets launched twice, or with a key nobody can identify
# afterward. This file makes the write repeatable instead.
#
# WHAT IT COSTS. The poller turns a new object under the validation prefix into a real
# multi-GPU training run, with no further approval needed. Treat applying this file as
# starting that run.
#
# THE TWO SAFETY PROPERTIES. Both are on purpose:
#
#   backoffLimit: 0     A retry must never write a second object. The poller de-duplicates
#                       by KEY and ETag. A retry that produces a different key, or the same
#                       key with different bytes, becomes a second run on top of the first,
#                       competing for the same GPUs.
#
#   fixed key + bytes   The operator supplies OBJECT_NAME, and the payload is constant. So
#                       re-applying this Job is idempotent: same key, same ETag, already in
#                       the poller's seen list, no new run starts. Running it again by
#                       accident does nothing. That is the behavior you want from the one
#                       manifest in this tree that spends GPU hours.
#
# Nothing here is specific to one environment. The bucket and prefix come from
# pipeline-config, and the endpoint and credential come from the flashblade-s3 Secret,
# exactly as the poller reads them.
#
# USAGE
#   oc -n <ns> delete job trigger-validation-object --ignore-not-found
#   oc -n <ns> create -f trigger-validation-object.yaml   # edit OBJECT_NAME first
#   oc -n <ns> logs job/trigger-validation-object
#
# Then force one poll instead of waiting for the schedule. This works whether or not the
# CronJob is suspended, because suspend only blocks *scheduled* runs:
#   oc -n <ns> create job trigger-poll --from=cronjob/s3-poller
#
# Verify the write with `aws s3 ls s3://<validation-bucket>/`. Never use a bare `aws s3 ls`:
# a bucket-scoped key cannot list the whole account, and returns AccessDenied even with a
# correct credential.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trigger-validation-object
  labels:
    app.kubernetes.io/part-of: ckpt-training-pipeline
    app.kubernetes.io/component: manual-trigger
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ckpt-training-pipeline
    spec:
      restartPolicy: Never
      containers:
        - name: put
          # Same image and version as the poller, so the client behavior that reads these
          # objects matches the client behavior that wrote them.
          image: docker.io/amazon/aws-cli:2.15.30
          env:
            # These are the two values an operator sets. Existing objects in the bucket
            # follow the pattern `trigger-<YYYY-MM-DD>.json`, containing
            # {"run":"<label>","date":"<YYYY-MM-DD>"}. Match this pattern instead of
            # inventing a new one, because the bucket is the record of what previous runs
            # were called. Add a suffix to the name (for example -15b) if a trigger for that
            # date already exists. The poller de-duplicates on key and ETag, so reusing an
            # existing key is a silent no-op.
            - name: OBJECT_NAME
              value: "REPLACE-ME.json"
            - name: RUN_LABEL
              value: "REPLACE-ME"
            - name: BUCKET
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: S3_VALIDATION_BUCKET
            - name: PREFIX
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: S3_VALIDATION_PREFIX
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: flashblade-s3
                  key: S3_ENDPOINT
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flashblade-s3
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flashblade-s3
                  key: AWS_SECRET_ACCESS_KEY
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              # TLS VERIFICATION IS DISABLED HERE. The storage array this pipeline was tested
              # against uses a self-signed certificate. This is NOT a recommendation. Supply
              # a CA bundle instead.
              AWS="aws --endpoint-url $S3_ENDPOINT --no-verify-ssl"

              if [ "$OBJECT_NAME" = "REPLACE-ME.json" ] || [ -z "$OBJECT_NAME" ] \
                 || [ "$RUN_LABEL" = "REPLACE-ME" ] || [ -z "$RUN_LABEL" ]; then
                echo "FATAL OBJECT_NAME and RUN_LABEL must both be set. Refusing to invent" >&2
                echo "      them: an unidentifiable object still costs a full training run." >&2
                exit 1
              fi

              KEY="${PREFIX}${OBJECT_NAME}"

              # Fail on an unreachable bucket before you try the upload, so the error names
              # the actual problem.
              if ! $AWS s3api head-bucket --bucket "$BUCKET" 2>/tmp/head.err; then
                echo "FATAL bucket unreachable: s3://$BUCKET :: $(tr -d '\n' < /tmp/head.err)" >&2
                exit 1
              fi

              # Keep the bytes constant: the ETag must be reproducible, so re-applying this
              # Job is a no-op. Get the date from OBJECT_NAME, not from `date`, so the
              # payload cannot change across a midnight boundary and turn a re-apply into a
              # second run.
              DATE=$(echo "$OBJECT_NAME" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
              printf '{"run":"%s","date":"%s"}\n' "$RUN_LABEL" "$DATE" > /tmp/payload.json

              if ! $AWS s3 cp /tmp/payload.json "s3://$BUCKET/$KEY" >/dev/null 2>/tmp/put.err; then
                echo "FATAL upload failed: s3://$BUCKET/$KEY :: $(tr -d '\n' < /tmp/put.err)" >&2
                exit 1
              fi

              # Read the object back. A silent no-op upload is the failure mode that matters
              # here: the poll that follows would find nothing, and report a healthy zero.
              ETAG=$($AWS s3api head-object --bucket "$BUCKET" --key "$KEY" \
                     --query ETag --output text 2>/tmp/head2.err)
              if [ -z "${ETAG:-}" ]; then
                echo "FATAL wrote s3://$BUCKET/$KEY but cannot read it back :: $(tr -d '\n' < /tmp/head2.err)" >&2
                exit 1
              fi

              echo "wrote key=$KEY etag=$ETAG bucket=$BUCKET"
              echo "trigger-object-written=1"
